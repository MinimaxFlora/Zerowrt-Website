name: Deploy Site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [firmware-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zerowrt-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.28.5
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Apply firmware dispatch payload
        if: github.event_name == 'repository_dispatch'
        run: node scripts/update-data.mjs
      - name: Sync live data for normal pushes
        if: github.event_name != 'repository_dispatch'
        run: node scripts/sync-data.mjs || true
      - name: Persist data changes
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name "Zerowrt Website Bot"
          git config user.email "bot@zerowrt.invalid"
          git add docs/public/ota.json docs/public/history.json
          if git diff --cached --quiet; then
            echo "data unchanged"
          else
            git commit -m "data: ${{ github.event.client_payload.entry.device }} ${{ github.event.client_payload.entry.version }} [skip ci]"
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.158.0 pages deploy docs/.vitepress/dist \
            --project-name=zerowrt-ota \
            --branch=main \
            --commit-dirty=true
